[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scoringbench"
dynamic = ["version"]
description = "Scoring rules for probabilistic tabular regression"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# What the benchmark code needs. Each model's own library (tabpfn, xgboost, ...) is
# imported only if installed; see scoringbench/univariate/wrappers/__init__.py.
dependencies = [
    "numpy>=2.0,<2.3",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "torch",
    "openml",
]

[project.optional-dependencies]
report = ["autorank"]
synthetic = ["pyvinecopulib>=1.0.0"]
test = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "scoringbench.version.__version__" }

[tool.setuptools.packages.find]
include = ["scoringbench*"]
